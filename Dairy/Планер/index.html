                return MOTIVATIONS[dayOfYear % MOTIVATIONS.length];

                            prayers: {

                setDayData(prev => {
                    const day = prev[dateKey] || {};
                    const completed = day.completedRoutine || [];
                    const newCompleted = completed.includes(idx)
                        ? completed.filter(i => i !== idx)
                        : [...completed, idx];
                    return {
                        ...prev,
                        [dateKey]: { ...day, completedRoutine: newCompleted }

                });
            };

            const fullStats = useMemo(() => {
                const getRangeStats = (dates) => {
                    const stats = { total: 0, completed: 0, byCategory: {} };
                    Object.keys(categories).forEach(id => stats.byCategory[id] = { total: 0, completed: 0 });

                            const catId = getItemType(item, categories);

                            if (completedIdxs.includes(idx)) {
                                stats.completed++;

                    d.setDate(d.getDate() + 1);

                const monthStats = getRangeStats(monthDates);

                                    <div className="bg-white rounded-3xl shadow-xl p-6 border-t-8 border-emerald-800">
                                        <div className="flex items-center justify-between mb-6">
                                            <h3 className="text-xl font-black text-emerald-900 flex items-center gap-2">
                                                <ClockIcon className="text-emerald-700" /> Рутина
                                            </h3>
                                            <span className="text-[10px] font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full uppercase border border-emerald-200">Истикома (Постоянство)</span>
                                        </div>
                                        <div className="space-y-3">
                                            {(routine[DAYS_OF_WEEK[selectedDate.getDay() === 0 ? 6 : selectedDate.getDay() - 1]] || []).map((item, idx) => {
                                                const catId = getItemType(item, categories);
                                                const category = categories[catId] || categories[Object.keys(categories)[0]];
                                                const color = COLOR_PRESETS[category.color] || COLOR_PRESETS.family;
                                                const dateKey = formatDateKey(selectedDate);
                                                const isCompleted = (dayData[dateKey]?.completedRoutine || []).includes(idx);

                                                return (
                                                    <div key={idx} className="relative">
                                                        <div className={`border-2 rounded-2xl p-4 ${isCompleted ? 'bg-emerald-50/30 opacity-60 border-emerald-100' : `${color.bg} ${color.border}`} flex items-center justify-between hover:shadow-md transition-all group`}>
                                                        <div className="flex-1 flex items-start gap-3">
                                                            <button 
                                                                    onClick={() => setActiveCategoryPicker(activeCategoryPicker === idx ? null : idx)}
                                                                className={`w-4 h-4 rounded-full mt-1.5 shrink-0 ${color.dot} shadow-sm border-2 border-white transition-transform hover:scale-125`}
                                                                title="Изменить категорию"
                                                            ></button>
                                                            <div className="flex-1">
                                                                    <div className={`text-[10px] font-black uppercase tracking-widest text-emerald-950/50 ${isCompleted ? 'line-through' : ''}`}>{item.time}</div>
                                                                <input 
                                                                    type="text" 
                                                                        value={item.activity || ''}
                                                                    onChange={(e) => {
                                                                        const dayName = DAYS_OF_WEEK[selectedDate.getDay() === 0 ? 6 : selectedDate.getDay() - 1];
                                                                        const newRoutine = { ...routine };
                                                                        newRoutine[dayName][idx].activity = e.target.value;
                                                                            newRoutine[dayName][idx].type = catId;
                                                                        setRoutine(newRoutine);
                                                                    }}
                                                                        className={`bg-transparent border-none focus:ring-0 w-full text-sm font-bold ${color.text} p-0 ${isCompleted ? 'line-through opacity-50' : ''}`}
                                                                />
                                                                </div>
                                                            </div>
                                                            <button 
                                                                onClick={() => toggleRoutineItem(dateKey, idx)}
                                                                className={`w-8 h-8 rounded-xl flex items-center justify-center transition-all ${
                                                                    isCompleted 
                                                                    ? 'bg-emerald-600 text-white shadow-inner' 
                                                                    : 'bg-white border-2 border-emerald-100 text-emerald-200 hover:border-emerald-400 hover:text-emerald-400'
                                                                }`}
                                                            >
                                                                {isCompleted ? '✓' : ''}
                                                            </button>
                                                        </div>

                                                        {activeCategoryPicker === idx && (
                                                            <div className="absolute top-full left-0 mt-2 z-50 bg-white rounded-2xl shadow-2xl border border-emerald-100 p-3 w-64 animate-fade-in">
                                                                <div className="grid grid-cols-1 gap-1">
                                                                    {Object.entries(categories).map(([id, cat]) => (
                                                                        <button
                                                                            key={id}
                                                                            onClick={() => {
                                                                                const dayName = DAYS_OF_WEEK[selectedDate.getDay() === 0 ? 6 : selectedDate.getDay() - 1];
                                                                                const newRoutine = { ...routine };
                                                                                newRoutine[dayName][idx].type = id;
                                                                                setRoutine(newRoutine);
                                                                                setActiveCategoryPicker(null);
                                                                            }}
                                                                            className="flex items-center gap-3 p-2 hover:bg-emerald-50 rounded-xl transition-colors text-left"
                                                                        >
                                                                            <div className={`w-3 h-3 rounded-full ${COLOR_PRESETS[cat.color].dot}`}></div>
                                                                            <span className="text-xs font-bold text-emerald-900">{cat.label}</span>
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : viewMode === 'stats' ? (
                        /* --- STATS VIEW --- */
                        <div className="space-y-8 animate-fade-in">
                            <div className="grid md:grid-cols-3 gap-6">
                                {[
                                    { label: 'Сегодня', data: fullStats.day, color: 'emerald' },
                                    { label: 'Неделя', data: fullStats.week, color: 'indigo' },
                                    { label: 'Месяц', data: fullStats.month, color: 'amber' }
                                ].map((period, idx) => {
                                    const percent = period.data.total > 0 ? Math.round((period.data.completed / period.data.total) * 100) : 0;
                                    return (
                                        <div key={idx} className="bg-white rounded-3xl shadow-xl p-8 border-t-8 border-emerald-800 flex flex-col items-center text-center">
                                            <h3 className="text-sm font-black text-emerald-800/40 uppercase tracking-widest mb-6">{period.label}</h3>
                                            <div className="relative w-32 h-32 flex items-center justify-center mb-6">
                                                <svg className="w-full h-full transform -rotate-90">
                                                    <circle cx="64" cy="64" r="58" stroke="currentColor" strokeWidth="12" fill="transparent" className="text-emerald-50" />
                                                    <circle cx="64" cy="64" r="58" stroke="currentColor" strokeWidth="12" fill="transparent" strokeDasharray={364.4} strokeDashoffset={364.4 - (364.4 * percent) / 100} className={`transition-all duration-1000 ${percent > 70 ? 'text-emerald-600' : percent > 40 ? 'text-amber-500' : 'text-rose-500'}`} strokeLinecap="round" />
                                                </svg>
                                                <div className="absolute inset-0 flex flex-col items-center justify-center">
                                                    <span className="text-3xl font-black text-emerald-900 leading-none">{percent}%</span>
                                                    <span className="text-[10px] font-black text-emerald-800/40 uppercase mt-1">Прогресс</span>
                                                </div>
                                            </div>
                                            <div className="text-sm font-bold text-emerald-900">
                                                {period.data.completed} / {period.data.total} <span className="text-emerald-800/30 font-medium ml-1">задач</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="bg-white rounded-3xl shadow-xl p-8 border-t-8 border-indigo-600">
                                <h3 className="text-xl font-black text-emerald-900 mb-8">🎯 Эффективность по категориям</h3>
                                <div className="grid md:grid-cols-2 gap-x-12 gap-y-8">
                                    {Object.entries(categories).map(([id, cat]) => {
                                        const stats = fullStats.month.byCategory[id] || { total: 0, completed: 0 };
                                        const percent = stats.total > 0 ? Math.round((stats.completed / stats.total) * 100) : 0;
                                        const color = COLOR_PRESETS[cat.color];
                                        return (
                                            <div key={id} className="space-y-3">
                                                <div className="flex justify-between items-end">
                                                    <div className="flex items-center gap-2">
                                                        <div className={`w-3 h-3 rounded-full ${color.dot}`}></div>
                                                        <span className="text-sm font-black text-emerald-900 uppercase tracking-tight">{cat.label}</span>
                                                    </div>
                                                    <span className="text-xs font-black text-emerald-900/40">{stats.completed} из {stats.total} за месяц</span>
                                                </div>
                                                <div className="relative h-4 bg-emerald-50 rounded-full overflow-hidden border border-emerald-100">
                                                    <div 
                                                        className={`absolute top-0 left-0 h-full transition-all duration-1000 ${color.dot} opacity-80`}
                                                        style={{ width: `${percent}%` }}
                                                    ></div>
                                                    <div className="absolute inset-0 flex items-center justify-center text-[10px] font-black text-emerald-900/60 uppercase">
                                                        {percent}%
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* --- MONTH VIEW --- */
                        <div className="bg-white rounded-3xl shadow-xl p-8 animate-fade-in border-t-8 border-emerald-800 arch-header">
                            <div className="flex items-center justify-between mb-10">
                                <h2 className="text-4xl font-black text-emerald-900">
                                    <span className="text-amber-600">⚜️</span> {MONTHS[selectedDate.getMonth()]} <span className="text-emerald-700">{selectedDate.getFullYear()}</span>
                                </h2>
                                <div className="flex gap-3 bg-emerald-50 p-2 rounded-2xl border border-emerald-100">
                                    <button onClick={() => {
                                        const d = new Date(selectedDate); d.setMonth(d.getMonth() - 1); setSelectedDate(d);
                                    }} className="p-2 hover:bg-white hover:shadow-md rounded-xl transition-all text-emerald-700"><ChevronLeft /></button>
                                    <button onClick={() => setSelectedDate(new Date())} className="px-6 py-2 text-sm font-black text-emerald-800 hover:text-emerald-600 transition-colors uppercase tracking-tighter">Сегодня</button>
                                    <button onClick={() => {
                                        const d = new Date(selectedDate); d.setMonth(d.getMonth() + 1); setSelectedDate(d);
                                    }} className="p-2 hover:bg-white hover:shadow-md rounded-xl transition-all text-emerald-700"><ChevronRight /></button>
                                </div>
                            </div>
                            <div className="calendar-grid text-center mb-4">
                                {DAYS_OF_WEEK.map(d => <div key={d} className="py-2 text-[10px] font-black text-emerald-800/40 uppercase tracking-widest">{d}</div>)}
                            </div>
                            <div className="calendar-grid bg-emerald-100 rounded-3xl overflow-hidden border border-emerald-100 shadow-inner">
                                {(() => {
                                    const year = selectedDate.getFullYear();
                                    const month = selectedDate.getMonth();
                                    const date = new Date(year, month, 1);
                                    const days = [];
                                    let firstDay = date.getDay() - 1;
                                    if (firstDay === -1) firstDay = 6;
                                    for (let i = 0; i < firstDay; i++) days.push(null);
                                    while (date.getMonth() === month) {
                                        days.push(new Date(date));
                                        date.setDate(date.getDate() + 1);
                                    }
                                    return days.map((date, i) => {
                                        if (!date) return <div key={`empty-${i}`} className="bg-emerald-50/30"></div>;
                                        const key = formatDateKey(date);
                                        const isToday = new Date().toDateString() === date.toDateString();
                                        return (
                                            <div 
                                                key={key} 
                                                className={`bg-white calendar-day p-2 border border-emerald-50 relative group ${isToday ? 'bg-emerald-50' : 'hover:bg-amber-50/10'}`}
                                            >
                                                <div className="flex justify-between items-start mb-1">
                                                    <span 
                                                        onClick={() => { setSelectedDate(date); setViewMode('week'); }}
                                                        className={`text-sm font-black cursor-pointer transition-all hover:scale-110 ${isToday ? 'text-white bg-emerald-700 px-2 py-1 rounded-lg shadow-md' : 'text-emerald-800/40 hover:text-emerald-700'}`}
                                                    >
                                                        {date.getDate()}
                                                    </span>
                                                    {isToday && <div className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping mt-2 mr-1"></div>}
                                                </div>
                                                
                                                <div className="h-full mt-auto" onClick={(e) => e.stopPropagation()}>
                                                    <textarea 
                                                        value={dayData[key]?.ihsan || ''}
                                                        onChange={(e) => updateDayValue(key, 'ihsan', e.target.value)}
                                                        className="w-full bg-transparent border-none text-[8px] md:text-[10px] leading-[1.1] font-bold text-emerald-900 placeholder:text-emerald-800/5 resize-none p-0 focus:ring-0 h-[40px] md:h-[60px] scrollbar-hide"
                                                        placeholder="Ихсан дня..."
                                                    />
                                                </div>
                                            </div>
                                        );
                                    });
                                })()}
                            </div>
                        </div>
                    )}

                    {/* Footer Legend */}
                    <footer className="mt-8 bg-emerald-900 rounded-3xl shadow-xl px-6 py-4 border-b-4 border-amber-500 text-white">
                        <div className="flex flex-wrap items-center gap-x-8 gap-y-4">
                            <div className="flex items-center gap-2 shrink-0">
                                <div className="w-4 h-0.5 bg-amber-400 rounded-full"></div>
                                <h3 className="font-black text-amber-400 uppercase text-[10px] tracking-[0.2em]">Кодекс</h3>
                            </div>

                            <div className="flex flex-wrap items-center gap-3">
                                {Object.entries(categories).map(([id, cat]) => (
                                    <div key={id} className="flex items-center gap-2 group relative">
                                        <div className="relative flex items-center">
                                            <button 
                                                onClick={() => setActiveCategoryPicker(activeCategoryPicker === `legend_${id}` ? null : `legend_${id}`)}
                                                className={`w-2.5 h-2.5 rounded-full ${COLOR_PRESETS[cat.color].dot} border border-white/20 shadow-sm hover:scale-125 transition-transform`}
                                            />
                                            {activeCategoryPicker === `legend_${id}` && (
                                                <div className="absolute bottom-full left-0 mb-3 z-50 bg-white p-1.5 rounded-xl shadow-2xl flex gap-1 border border-emerald-100 animate-fade-in">
                                                    {Object.keys(COLOR_PRESETS).map(colorName => (
                                                        <button
                                                            key={colorName}
                                                            onClick={() => {
                                                                setCategories(prev => ({ ...prev, [id]: { ...cat, color: colorName } }));
                                                                setActiveCategoryPicker(null);
                                                            }}
                                                            className={`w-3.5 h-3.5 rounded-full ${COLOR_PRESETS[colorName].dot} border border-black/5 hover:scale-125 transition-transform`}
                                                        />
                                                    ))}
                                                </div>
                                            )}
                            </div>
                                        <input 
                                            type="text"
                                            value={cat.label}
                                            onChange={(e) => setCategories(prev => ({
                                                ...prev,
                                                [id]: { ...cat, label: e.target.value }
                                            }))}
                                            className="bg-transparent border-none focus:ring-0 p-0 text-[11px] font-bold text-emerald-50/70 w-20 placeholder:text-white/10"
                                            placeholder="Категория..."
                                        />
                                        <button 
                                            onClick={() => {
                                                const newCats = { ...categories };
                                                delete newCats[id];
                                                setCategories(newCats);
                                            }}
                                            className="opacity-0 group-hover:opacity-100 text-[8px] text-white/30 hover:text-white transition-all w-0 group-hover:w-3 overflow-hidden"
                                        >✕</button>
                            </div>
                                ))}
                                
                                <button 
                                    onClick={() => {
                                        const id = `cat_${Date.now()}`;
                                        setCategories(prev => ({
                                            ...prev,
                                            [id]: { color: 'emerald', label: '' }
                                        }));
                                    }}
                                    className="w-5 h-5 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white/30 hover:text-white transition-all border border-white/5 text-xs ml-2"
                                >+</button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
