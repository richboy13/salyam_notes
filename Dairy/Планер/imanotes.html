        .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: #064e3b;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 10px;
            position: absolute;
            z-index: 50;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.7rem;
            line-height: 1.1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);

            pointer-events: none;

        @media (max-width: 640px) {
            .tooltip-text {
                width: 160px;
                left: auto;
                right: 0;
                transform: none;
            }
        }
        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #064e3b transparent transparent transparent;
        }
        .tooltip-container:hover .tooltip-text {

                    )}

                    {/* Footer Legend */}
                    <footer className="mt-8 bg-emerald-900 rounded-3xl shadow-xl px-6 py-4 border-b-4 border-amber-500 text-white">
                        <div className="flex flex-wrap items-center gap-x-8 gap-y-4">
                            <div className="flex items-center gap-2 shrink-0">
                                <div className="w-4 h-0.5 bg-amber-400 rounded-full"></div>
                                <h3 className="font-black text-amber-400 uppercase text-[10px] tracking-[0.2em]">Кодекс</h3>
                            </div>

                            <div className="flex flex-wrap items-center gap-3">
                                {Object.entries(categories).map(([id, cat]) => (
                                    <div key={id} className="flex items-center gap-2 group relative">
                                        <div className="relative flex items-center">
                                            <button 
                                                onClick={() => setActiveCategoryPicker(activeCategoryPicker === `legend_${id}` ? null : `legend_${id}`)}
                                                className={`w-2.5 h-2.5 rounded-full ${COLOR_PRESETS[cat.color].dot} border border-white/20 shadow-sm hover:scale-125 transition-transform`}
                                            />
                                            {activeCategoryPicker === `legend_${id}` && (
                                                <div className="absolute bottom-full left-0 mb-3 z-50 bg-white p-1.5 rounded-xl shadow-2xl flex gap-1 border border-emerald-100 animate-fade-in">
                                                    {Object.keys(COLOR_PRESETS).map(colorName => (
                                                        <button
                                                            key={colorName}
                                                            onClick={() => {
                                                                setCategories(prev => ({ ...prev, [id]: { ...cat, color: colorName } }));
                                                                setActiveCategoryPicker(null);
                                                            }}
                                                            className={`w-3.5 h-3.5 rounded-full ${COLOR_PRESETS[colorName].dot} border border-black/5 hover:scale-125 transition-transform`}
                                                        />
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <input 
                                            type="text"
                                            value={cat.label}
                                            onChange={(e) => setCategories(prev => ({
                                                ...prev,
                                                [id]: { ...cat, label: e.target.value }
                                            }))}
                                            className="bg-transparent border-none focus:ring-0 p-0 text-[11px] font-bold text-emerald-50/70 w-20 placeholder:text-white/10"
                                            placeholder="Категория..."
                                        />
                                        <button 
                                            onClick={() => {
                                                const newCats = { ...categories };
                                                delete newCats[id];
                                                setCategories(newCats);
                                            }}
                                            className="opacity-0 group-hover:opacity-100 text-[8px] text-white/30 hover:text-white transition-all w-0 group-hover:w-3 overflow-hidden"
                                        >✕</button>
                                    </div>
                                ))}
                                
                                <button 
                                    onClick={() => {
                                        const id = `cat_${Date.now()}`;
                                        setCategories(prev => ({
                                            ...prev,
                                            [id]: { color: 'emerald', label: '' }
                                        }));
                                    }}
                                    className="w-5 h-5 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white/30 hover:text-white transition-all border border-white/5 text-xs ml-2"
                                >+</button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
